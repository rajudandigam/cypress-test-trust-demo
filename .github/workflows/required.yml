name: required

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  DEMO_MODE: "true"
  DEMO_SCENARIO: "healthy"
  DEMO_FIXED_NOW: "2026-10-01T12:00:00.000Z"
  SESSION_SECRET: "ci-session-secret"
  COOKIE_NAME: "cttd_session"
  SEED_PASSWORD: "Password123!"
  ALLOWED_DB_NAME_PATTERN: "cypress_test_trust_demo"
  PORT: "3000"
  API_PORT: "3001"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: cypress_demo
          POSTGRES_PASSWORD: cypress_demo
          POSTGRES_DB: cypress_test_trust_demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cypress_demo -d cypress_test_trust_demo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cypress_demo:cypress_demo@127.0.0.1:5432/cypress_test_trust_demo_test
      TEST_DATABASE_URL: postgresql://cypress_demo:cypress_demo@127.0.0.1:5432/cypress_test_trust_demo_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Policy
        run: npm run test:policy
      - name: API tests
        run: npm run test:api
      - name: Record versions
        run: |
          node -v
          npm -v
          npx cypress version
          psql --version || true

  booking-critical:
    name: booking-critical
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: cypress_demo
          POSTGRES_PASSWORD: cypress_demo
          POSTGRES_DB: cypress_test_trust_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cypress_demo -d cypress_test_trust_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cypress_demo:cypress_demo@127.0.0.1:5432/cypress_test_trust_demo
      CYPRESS_baseUrl: http://127.0.0.1:3000
      # No Cypress Cloud / AI credentials in the required path
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed
      - name: Build
        run: npm run build
      - name: Critical Cypress contract
        run: npm run test:critical
      - name: Upload critical evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: critical-evidence-${{ github.sha }}
          path: |
            demo/evidence/raw/
            cypress/screenshots/
          if-no-files-found: warn

  ci-required:
    name: ci-required
    runs-on: ubuntu-24.04
    needs: [verify, booking-critical]
    if: always()
    steps:
      - name: Require both jobs succeeded
        run: |
          echo "verify=${{ needs.verify.result }}"
          echo "booking-critical=${{ needs.booking-critical.result }}"
          if [ "${{ needs.verify.result }}" != "success" ] || [ "${{ needs.booking-critical.result }}" != "success" ]; then
            echo "ci-required failed: skipped/cancelled/failed/missing required results are treated as failure"
            exit 1
          fi
          echo "ci-required passed"
